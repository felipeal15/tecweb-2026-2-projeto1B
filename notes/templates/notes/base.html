{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Get-it{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
      integrity="sha512-NmLkDIU1C/C88wi324HBc+S2kLhi08PN5GDeUVVVC/BVt/9Izdsc9SVeVfA1UZbY3sHUlDSyRXhCzHfr6hmPPw=="
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'notes/css/getit.css' %}" />
  </head>

  <body>
    <div class="appbar">
      <a class="appbar-brand" href="{% url 'index' %}">
        <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" alt="Get-it" />
      </a>
      <span class="subtitle">Como o Post-it, mas com outro verbo</span>
      <nav class="appbar-nav">
        <a class="appbar-link" href="{% url 'index' %}">Anotações</a>
        <a class="appbar-link" href="{% url 'tags' %}">Tags</a>
      </nav>
    </div>

    <main class="container">
      {% block content %} {% endblock %}
    </main>

    <script type="text/javascript" src="{% static 'notes/js/getit.js' %}"></script>
  </body>
</html>
