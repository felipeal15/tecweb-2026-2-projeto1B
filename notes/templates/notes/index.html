{% extends "notes/base.html" %}

{% block content %}
<form class="form-card" method="post" action="{% url 'index' %}">
  {% csrf_token %}
  {% if erro %}
  <p class="form-error">{{ erro }}</p>
  {% endif %}
  <input
    class="form-card-title"
    type="text"
    name="titulo"
    placeholder="Título"
    value="{{ titulo }}"
  />
  <textarea
    class="autoresize"
    name="detalhes"
    placeholder="Digite o conteúdo..."
  >{{ detalhes }}</textarea>
  <input
    class="form-card-tag"
    type="text"
    name="tag"
    placeholder="Adicione uma tag"
    value="{{ tag }}"
  />
  <button class="btn" type="submit">Criar</button>
</form>

<div class="card-container">
  {% for note in notes %}
  {% include "notes/components/note_card.html" with acoes=True %}
  {% empty %}
  <p class="card-vazio">Nenhuma anotação ainda. Escreva a primeira!</p>
  {% endfor %}
</div>
{% endblock %}
